
<!DOCTYPE html>
<html lang="es-ES">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>GUI_BEAMED</title>
    <meta name="description" content="Artista visual. Fotografía analógica, tipografía, tinta impresa y papel.">

    <!-- Tipografía Work Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;700&display=swap" rel="stylesheet">

    <!-- CSS de Splide -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css">

    <!-- Hoja de estilos propia -->
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <header id="header" class="header__home">
        <div class="container">
            <div class="header__content">

                <div class="logo logo-home">
                    <h1 class="logo__h1">GUI_BEAMED</h1>
                </div>

                <div class="select-lang">
                    <ul class="select-lang__ul">
                        <li class="current-lang">
                            <a lang="es-ES" href="#">es</a>
                        </li>
                        <li>
                            <a lang="en-US" href="#">en</a>
                        </li>
                    </ul>
                </div>

                <button class="menu-mobile"
                        type="button"
                        aria-label="Abrir menú"
                        aria-expanded="false"
                        aria-controls="nav">
                    <span class="menu-mobile-icon">
                        <span class="menu-mobile-bar"></span>
                    </span>
                </button>

            </div>

            <nav id="nav" class="navigation">
                <ul class="menu">
                    <li><a href="personal.html">Personal</a></li>
                    <li><a href="./subpaginas/proyectos.html">Proyectos</a></li>
                    <li><a href="info.html">Info</a></li>
                    <li><a href="yo.html">Yo</a></li>
                </ul>

                <ul class="select-lang__menu">
                    <li><a lang="es-ES" href="#">es</a></li>
                    <li><a lang="en-US" href="#">en</a></li>
                </ul>
            </nav>

        </div>
    </header>

    <main id="page">
        <section class="slideshow">

            <!-- PANEL PERSONAL -->
            <div id="slide01" class="splide splide__one">
                <a href="./personal.html" class="panel-link">

                    <div class="splide__text">
                        <h2 class="splide__title">Personal</h2>
                    </div>

                    <div class="splide__overlay"></div>

                    <div class="splide__track">
                        <ul class="splide__list">

                            <li class="splide__slide">
                                <div class="splide__image" style="background-image: url(./imgweb/YO.png);"></div>
                           </li>

                            <li class="splide__slide">
                                <div class="splide__image" style="background-image: url('./');"></div>
                            </li>

                            <li class="splide__slide">
                                <div class="splide__image" style="background-image: url('./');"></div>
                            </li>

                            <li class="splide__slide">
                                <div class="splide__image" style="background-image: url('./');"></div>
                            </li>

                            <li class="splide__slide">
                                <div class="splide__image" style="background-image: url('./');"></div>
                            </li>

                            <li class="splide__slide">
                                <div class="splide__image" style="background-image: url('./');"></div>
                            </li>

                            <li class="splide__slide">
                                <div class="splide__image" style="background-image: url('./');"></div>
                            </li>

                            <li class="splide__slide">
                                <div class="splide__image" style="background-image: url('./');"></div>
                            </li>

                        </ul>
                    </div>

                </a>
            </div>

            <!-- PANEL PROYECTOS -->
            <div id="slide02" class="splide splide__two">

                <a href="./proyectos.html" class="panel-link">

                    <div class="splide__text">
                        <h2 class="splide__title">Proyectos</h2>
                    </div>

                    <div class="splide__overlay"></div>

                    <div class="splide__track">
                        <ul class="splide__list">

                            <li class="splide__slide">
                                <div class="splide__image" style="background-image: url('./imgweb/CEMOpng.png');"></div>
                            </li>

                            <li class="splide__slide">
                                <div class="splide__image" style="background-image: url('./imgweb/LPDM.png');"></div>
                            </li>

                            <li class="splide__slide">
                                <div class="splide__image" style="background-image: url('./imgweb/RIAL.png');"></div>
                            </li>

                            <li class="splide__slide">
                                <div class="splide__image" style="background-image: url('./imgweb/STARSTABS.png');"></div>
                            </li>

                            <li class="splide__slide">
                                <div class="splide__image" style="background-image: url('./imgweb/TarjetaCRB.png');"></div>

                        </ul>
                    </div>

                </a>
            </div>

        </section>
    </main>

    <!-- JavaScript de Splide -->
    <script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>

    <script>
        // Carrusel Personal
        new Splide("#slide01", {
            type: "loop",
            perPage: 1,
            perMove: 1,
            autoplay: true,
            interval: 3500,
            speed: 1000,
            arrows: false,
            pagination: false,
            drag: true,
            pauseOnHover: false,
            pauseOnFocus: false,
            rewind: false
        }).mount();

        // Carrusel Proyectos
        new Splide("#slide02", {
            type: "loop",
            perPage: 1,
            perMove: 1,
            autoplay: true,
            interval: 3500,
            speed: 1000,
            arrows: false,
            pagination: false,
            drag: true,
            pauseOnHover: false,
            pauseOnFocus: false,
            rewind: false
        }).mount();

        // Menú móvil
        const menuButton = document.querySelector(".menu-mobile");
        const navigation = document.querySelector("#nav");

        menuButton.addEventListener("click", function () {
            const isOpen = navigation.classList.toggle("open");

            menuButton.classList.toggle("close", isOpen);
            menuButton.setAttribute("aria-expanded", isOpen);
            menuButton.setAttribute(
                "aria-label",
                isOpen ? "Cerrar menú" : "Abrir menú"
            );
        });
    </script>

</body>
</html>
